# 32-bit ARM's Go toolchain defaults to -buildmode=pie, which needs external
# (cgo) linking. Ebuilds that read CGO_ENABLED rather than hardcoding it off
# themselves (containerd's main binaries, notably) build fine once this is
# on. The ones that hardcode CGO_ENABLED=0 in their own Makefile (go-md2man,
# containerd's shim target) still need a targeted patch -- see
# post-assemble.sh's /etc/portage/bashrc hook below.
CGO_ENABLED=1
